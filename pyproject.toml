[project]
name = "re-identify-me"
version = "0.1.0"
description = "Pas d'identifiant direct ne veut pas dire anonyme : un jeu pédagogique sur la ré-identification, sur l'île de Kerdata."
readme = "README.md"
authors = [{ name = "Morgan Guillaudeux" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.scripts]
kerdata = "kerdata.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kerdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests de bout en bout (plus lents)"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["kerdata"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501"]
